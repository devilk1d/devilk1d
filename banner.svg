<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ibnu Dwito Abimanyu, machine learning and web development">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .curve { stroke-dasharray: 800; stroke-dashoffset: 0; animation: draw 6s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; }
    @keyframes draw { 0% { stroke-dashoffset: 800; } 55%, 100% { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#C9F24D" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#101213"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <g class="mono">
    <text x="64" y="82" font-size="20" fill="#C9F24D">$ python train.py --who abim</text>
    <text x="60" y="168" font-size="60" font-weight="700" fill="#F4F4F0">Ibnu Dwito</text>
    <text x="60" y="236" font-size="60" font-weight="700" fill="#F4F4F0">Abimanyu<tspan class="cursor" fill="#C9F24D">_</tspan></text>
    <text x="64" y="298" font-size="22" fill="#A6ACB2">machine learning / nlp / web development</text>
  </g>

  <!-- training window -->
  <g transform="translate(690 48)">
    <rect width="450" height="264" rx="12" fill="#181B1C" stroke="#2C3133"/>
    <circle cx="24" cy="24" r="6" fill="#C9F24D"/>
    <circle cx="44" cy="24" r="6" fill="#C9F24D" fill-opacity="0.5"/>
    <circle cx="64" cy="24" r="6" fill="#C9F24D" fill-opacity="0.25"/>
    <text class="mono" x="426" y="29" font-size="14" text-anchor="end" fill="#7D848A">loss.png</text>
    <path d="M40 56V224H420" fill="none" stroke="#4A5155" stroke-width="2"/>
    <path d="M40 98H420M40 140H420M40 182H420" stroke="#2C3133" stroke-dasharray="4 6"/>
    <path class="curve" d="M48 66C75 130 95 150 125 160S165 150 190 178S250 190 280 196S350 212 412 210" fill="none" stroke="#C9F24D" stroke-width="4" stroke-linecap="round"/>
    <g fill="#F4F4F0">
      <circle class="node" cx="125" cy="160" r="5"/>
      <circle class="node d1" cx="190" cy="178" r="5"/>
      <circle class="node d2" cx="280" cy="196" r="5"/>
      <circle class="node d3" cx="412" cy="210" r="5"/>
    </g>
    <text class="mono" x="40" y="248" font-size="14" fill="#7D848A">epoch</text>
    <text class="mono" x="420" y="248" font-size="14" text-anchor="end" fill="#C9F24D">still training</text>
  </g>
</svg>
